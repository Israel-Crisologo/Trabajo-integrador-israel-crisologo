resources:
  jobs:
    electrocasa_job:
      name: Electrocasa_job

      tasks:
        - task_key: Bronze_ingestion
          disabled: false
          email_notifications: {}
          environment_key: Default
          run_if: ALL_SUCCESS
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          spark_python_task:
            python_file: ${workspace.file_path}/src/electrocasa/transformations/Bronze.py
          timeout_seconds: 0
          webhook_notifications: {}

        - task_key: Electrocasa_pipeline
          depends_on:
            - task_key: Bronze_ingestion
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          pipeline_task:
            pipeline_id: ${resources.pipelines.electrocasa.id}
            full_refresh: false
          timeout_seconds: 0
          webhook_notifications: {}

      email_notifications:
        on_failure:
          - u19209136@utp.edu.pe
        no_alert_for_skipped_runs: false

      environments:
        - environment_key: Default
          spec:
            environment_version: "5"

      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED

      queue:
        enabled: true

      timeout_seconds: 0
      webhook_notifications: {}
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
